name: IA integration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_run:
    workflows: [ci, Supabase CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to integrate
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: ia-integration-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  integrate:
    name: Automated review and integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No checkout, artifacts or PR code are executed with this write token.
      - name: Review tested head and merge through branch protection
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const repository = process.env.GITHUB_REPOSITORY;
          const requiredChecks = ['verify', 'Unit, database, and integration tests'];
          const label = 'ia-automerge';
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function api(method, path, body) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              method, redirect: 'error', signal: AbortSignal.timeout(30000),
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
            });
            if (!response.ok) throw new Error(`GitHub ${method} ${path}: HTTP ${response.status}`);
            return response.json();
          }

          function eligible(pr) {
            return pr.state === 'open' && !pr.draft && pr.base.ref === 'main'
              && pr.base.repo.full_name === repository && pr.head.repo?.full_name === repository
              && /^(claude|feat)\/.+/.test(pr.head.ref)
              && pr.labels.some(item => item.name === label);
          }

          async function checksFor(sha) {
            const latest = new Map();
            for (let page = 1; ; page++) {
              if (page > 10) throw new Error('Check pagination exceeded; nothing was approved');
              const result = await api('GET', `commits/${sha}/check-runs?per_page=100&page=${page}`);
              for (const check of result.check_runs) {
                if (check.app?.slug !== 'github-actions' || !requiredChecks.includes(check.name)) continue;
                if (!latest.has(check.name) || check.id > latest.get(check.name).id) latest.set(check.name, check);
              }
              if (result.check_runs.length < 100) break;
            }
            const checks = requiredChecks.map(name => latest.get(name));
            if (checks.some(check => check && check.status === 'completed' && check.conclusion !== 'success')) return 'failed';
            return checks.every(check => check?.head_sha === sha && check.status === 'completed' && check.conclusion === 'success')
              ? 'ready' : 'pending';
          }

          async function reviewsFor(number) {
            const latest = new Map();
            for (let page = 1; ; page++) {
              if (page > 10) throw new Error('Review pagination exceeded; nothing was approved');
              const reviews = await api('GET', `pulls/${number}/reviews?per_page=100&page=${page}`);
              for (const review of reviews) {
                if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)
                  && (!latest.has(review.user.login) || review.id > latest.get(review.user.login).id)) latest.set(review.user.login, review);
              }
              if (reviews.length < 100) break;
            }
            return [...latest.values()];
          }

          async function integrate(number, expectedSha) {
            let pr = await api('GET', `pulls/${number}`);
            if (!eligible(pr)) return console.log(`#${number}: no opt-in eligible PR`);
            const sha = expectedSha || pr.head.sha;
            const permission = await api('GET', `collaborators/${encodeURIComponent(pr.user.login)}/permission`);
            if (!['admin', 'write', 'maintain'].includes(permission.permission)) return console.log(`#${number}: author has no write access`);
            const attempts = process.env.GITHUB_EVENT_NAME === 'pull_request' ? 90 : 1;
            for (let attempt = 0; attempt < attempts; attempt++) {
              pr = await api('GET', `pulls/${number}`);
              if (!eligible(pr) || pr.head.sha !== sha) return console.log(`#${number}: head or eligibility changed`);
              if (pr.mergeable === false || ['behind', 'dirty'].includes(pr.mergeable_state)) return console.log(`#${number}: update branch and rerun CI`);
              const checks = await checksFor(sha);
              if (checks === 'failed') return console.log(`#${number}: CI failed; no approval`);
              if (checks !== 'ready' || pr.mergeable === null) {
                if (attempt + 1 < attempts) await pause(10000);
                continue;
              }
              const reviews = await reviewsFor(number);
              if (reviews.some(review => review.state === 'CHANGES_REQUESTED')) return console.log(`#${number}: requested changes are still pending`);
              // Bind the review to the exact tested commit, never to a newer untested push.
              pr = await api('GET', `pulls/${number}`);
              if (!eligible(pr) || pr.head.sha !== sha || ['behind', 'dirty'].includes(pr.mergeable_state)) return console.log(`#${number}: changed before review`);
              if (!reviews.some(review => review.user.login === 'github-actions[bot]' && review.state === 'APPROVED' && review.commit_id === sha)) {
                await api('POST', `pulls/${number}/reviews`, { event: 'APPROVE', commit_id: sha,
                  body: `Revisión automática de integración: autor con escritura, rama del repositorio y opt-in ${label}. ${requiredChecks.join(' + ')} aprobados sobre ${sha}. Esta revisión es automática, no una revisión humana del código.` });
              }
              pr = await api('GET', `pulls/${number}`);
              if (!eligible(pr) || pr.head.sha !== sha || ['behind', 'dirty'].includes(pr.mergeable_state)
                || await checksFor(sha) !== 'ready') return console.log(`#${number}: changed after review; merge omitted`);
              const merged = await api('PUT', `pulls/${number}/merge`, { sha, merge_method: 'merge' });
              if (!merged.merged) throw new Error(`#${number}: branch protection did not permit integration`);
              console.log(`#${number}: merged tested ${sha} as ${merged.sha}`);
              return;
            }
            console.log(`#${number}: CI still pending; completion events or workflow_dispatch can resume`);
          }

          async function main() {
            if (!repository || !process.env.GH_TOKEN) throw new Error('Missing Actions repository or token');
            if (event.pull_request) return integrate(event.pull_request.number, event.pull_request.head.sha);
            if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
              const number = Number(process.env.PR_NUMBER);
              if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid pull request number');
              return integrate(number);
            }
            const run = event.workflow_run;
            if (!run || run.event !== 'pull_request' || run.head_repository?.full_name !== repository) return;
            const candidates = run.pull_requests?.length ? run.pull_requests
              : await api('GET', `pulls?state=open&head=${encodeURIComponent(`${repository.split('/')[0]}:${run.head_branch}`)}&per_page=100`);
            for (const pr of candidates) await integrate(pr.number, run.head_sha);
          }

          try { await main(); } catch (error) { console.error(error.message); process.exitCode = 1; }
          NODE
