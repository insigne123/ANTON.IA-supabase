# «Mercado público» (OPP-16): the history behind «Cómo ganar», «Contratos por vencer» and «Competidores» was loaded once, by hand
# (scripts/load-public-procurement.mjs, 19 Oct 2026), and would fall behind a month at a time. This loads ChileCompra's new monthly
# files and ages the old ones on the 2nd of each month, after ChileCompra publishes the month before. It runs only with the two secrets
# set in the repository (Settings → Secrets and variables → Actions); without them it says so and stops. A failure opens an issue.
name: Mercado público mensual

on:
  schedule:
    - cron: '17 9 2 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: public-procurement
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.PUBLIC_PROCUREMENT_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PUBLIC_PROCUREMENT_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sin los secretos no hay carga
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "::notice::Faltan PUBLIC_PROCUREMENT_SUPABASE_URL y PUBLIC_PROCUREMENT_SERVICE_ROLE_KEY en los secretos del repositorio; la carga mensual no corre."
      - name: Cargar los meses nuevos y envejecer los antiguos
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: node scripts/load-public-procurement.mjs
      - name: Avisar si falló
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'La carga mensual de Mercado público falló',
              body: `La carga de ChileCompra del día 2 no terminó: ${run}\n\nMientras tanto «Cómo ganar», «Contratos por vencer» y «Competidores» muestran los datos hasta el mes anterior. Se puede repetir a mano desde Actions → «Mercado público mensual» → «Run workflow».`,
            });
