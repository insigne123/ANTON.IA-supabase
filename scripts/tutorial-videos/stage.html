<!doctype html>
<!--
  The stage of a tutorial video (Plan 11, PR 7a): the app runs live in the iframe, inside a window, and everything that
  explains it is drawn around and over it: the module and step at the top, notes and a post-it at the side, an arrow to
  the control being explained, a highlight around it, the cursor (slow, large, with a halo on each click) and the
  subtitle at the bottom. record.mjs calls window.stage.render(state) once per frame and takes a screenshot. Colors are
  the app's own tokens (src/styles/design-tokens.css), light theme.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escena</title>
<style id="fonts"></style>
<style>
  :root {
    --primary: hsl(217.2 91.2% 45%);
    --primary-soft: hsl(217.2 91.2% 45% / 0.09);
    --primary-ring: hsl(217.2 91.2% 45% / 0.45);
    --foreground: hsl(222.2 47.4% 11.2%);
    --muted: hsl(215 16.3% 46.9%);
    --border: hsl(214.3 31.8% 91.4%);
    --card: #fff;
    --warning: #b45309;
    --warning-soft: #fffbeb;
    --success: #047857;
    --body-font: 'PT Sans', ui-sans-serif, system-ui, sans-serif;
    --heading-font: 'Poppins', ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #f6f8fc; font-family: var(--body-font); color: var(--foreground); }
  #bg { position: absolute; inset: 0; background:
      radial-gradient(1100px 520px at 0% 0%, hsl(217.2 91.2% 45% / 0.10), transparent 60%),
      radial-gradient(900px 600px at 100% 100%, hsl(217.2 91.2% 45% / 0.07), transparent 60%), #f6f8fc; }
  #header { position: absolute; left: 32px; top: 18px; right: 32px; height: 40px; display: flex; align-items: center; gap: 14px; }
  #logo { width: 32px; height: 32px; border-radius: 10px; background: var(--primary); color: #fff; display: grid; place-items: center;
    font: 700 15px/1 var(--heading-font); letter-spacing: -0.02em; }
  #module { font: 600 21px/1.1 var(--heading-font); letter-spacing: -0.02em; }
  #chapter { margin-left: auto; font: 600 13px/1 var(--body-font); color: var(--primary); background: var(--primary-soft);
    border: 1px solid hsl(217.2 91.2% 45% / 0.25); border-radius: 999px; padding: 8px 14px; }
  #window { position: absolute; left: 32px; top: 72px; width: 870px; height: 560px; border-radius: 16px; background: var(--card);
    border: 1px solid var(--border); box-shadow: 0 28px 70px -36px rgba(15, 23, 42, 0.35), 0 1px 2px rgba(15, 23, 42, 0.06); overflow: hidden; }
  #chrome { height: 16px; background: linear-gradient(#fbfcfe, #f3f6fa); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 5px; padding-left: 10px; }
  #chrome i { width: 6px; height: 6px; border-radius: 50%; background: hsl(214.3 31.8% 84%); }
  #viewport { position: absolute; left: 0; top: 16px; width: 870px; height: 544px; overflow: hidden; background: #fff; }
  #app { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; }
  #side { position: absolute; left: 928px; top: 72px; width: 320px; height: 560px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: 0 10px 28px -18px rgba(15, 23, 42, 0.25); }
  #note .kicker { font: 700 11px/1 var(--body-font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary); }
  #note h2 { margin: 8px 0 6px; font: 600 20px/1.2 var(--heading-font); letter-spacing: -0.02em; }
  #note p { margin: 0; font: 16px/1.45 var(--body-font); color: hsl(222.2 30% 26%); }
  #postit { background: var(--warning-soft); border: 1px solid hsl(32 95% 44% / 0.35); color: hsl(25 70% 22%); border-radius: 6px 14px 14px 14px;
    transform: rotate(-1.4deg); box-shadow: 0 14px 26px -18px rgba(180, 83, 9, 0.55); }
  #postit .kicker { font: 700 11px/1 var(--body-font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--warning); }
  #postit p { margin: 8px 0 0; font: 15px/1.45 var(--body-font); }
  #progress { margin-top: auto; display: flex; gap: 6px; }
  #progress span { flex: 1; height: 6px; border-radius: 999px; background: hsl(214.3 31.8% 88%); }
  #progress span.done { background: var(--primary); }
  #progress span.now { background: hsl(217.2 91.2% 45% / 0.55); }
  #subtitle { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: 1100px; padding: 10px 20px; border-radius: 12px;
    background: rgba(15, 23, 42, 0.86); color: #fff; font: 19px/1.35 var(--body-font); text-align: center; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; pointer-events: none; filter: drop-shadow(0 3px 4px rgba(15, 23, 42, 0.35)); }
  #halo { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 4px solid var(--primary-ring);
    background: hsl(217.2 91.2% 45% / 0.12); pointer-events: none; }
  #card { position: absolute; inset: 0; display: grid; place-items: center; background:
      radial-gradient(900px 500px at 30% 20%, hsl(217.2 91.2% 45% / 0.16), transparent 60%), #f6f8fc; }
  #card .inner { width: 820px; text-align: left; }
  #card .kicker { font: 700 14px/1 var(--body-font); letter-spacing: 0.16em; text-transform: uppercase; color: var(--primary); }
  #card h1 { margin: 16px 0 14px; font: 600 54px/1.05 var(--heading-font); letter-spacing: -0.035em; }
  #card p { margin: 0; font: 24px/1.45 var(--body-font); color: hsl(222.2 30% 30%); }
  #card ul { margin: 22px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; font: 20px/1.35 var(--body-font); }
  #card li::before { content: '✓'; color: var(--success); font-weight: 700; margin-right: 10px; }
</style>
</head>
<body>
  <div id="bg"></div>
  <header id="header"><span id="logo">A</span><span id="module"></span><span id="chapter"></span></header>
  <div id="window"><div id="chrome"><i></i><i></i><i></i></div><div id="viewport"><iframe id="app" title="ANTON.IA"></iframe></div></div>
  <aside id="side">
    <section id="note" class="card"><div class="kicker"></div><h2></h2><p></p></section>
    <section id="postit" class="card"><div class="kicker">Tip</div><p></p></section>
    <div id="progress"></div>
  </aside>
  <svg id="overlay" width="1280" height="720" viewBox="0 0 1280 720" aria-hidden="true">
    <defs>
      <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="hsl(217.2 91.2% 45%)"></path>
      </marker>
    </defs>
    <rect id="highlight" rx="10" ry="10" fill="hsl(217.2 91.2% 45% / 0.08)" stroke="hsl(217.2 91.2% 45%)" stroke-width="3"></rect>
    <path id="arrow" fill="none" stroke="hsl(217.2 91.2% 45%)" stroke-width="4" stroke-linecap="round" marker-end="url(#head)"></path>
  </svg>
  <div id="halo"></div>
  <svg id="cursor" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2 L3 19.5 L7.6 15.4 L10.6 22 L13.7 20.6 L10.8 14.2 L17 14.2 Z" fill="#fff" stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round"></path></svg>
  <div id="subtitle"></div>
  <div id="card"><div class="inner"><div class="kicker"></div><h1></h1><p></p><ul></ul></div></div>
<script>
  const $ = (selector) => document.querySelector(selector);
  const text = (selector, value) => { const element = $(selector); if (element.textContent !== value) element.textContent = value || ''; };
  const show = (element, opacity) => { element.style.opacity = String(opacity ?? 0); element.style.visibility = opacity > 0.001 ? 'visible' : 'hidden'; };
  let lastSteps = '';
  window.stage = {
    /** Copies the app's fonts into the stage, so notes and subtitles read in the same type as the app. */
    adoptFonts() {
      const frame = $('#app').contentDocument;
      if (!frame) return false;
      const rules = [];
      for (const sheet of frame.styleSheets) {
        let list = [];
        try { list = sheet.cssRules; } catch { continue; }
        for (const rule of list) if (rule.constructor.name === 'CSSFontFaceRule') rules.push(rule.cssText);
      }
      $('#fonts').textContent = rules.join('\n');
      const style = getComputedStyle(frame.body);
      const body = style.getPropertyValue('--font-body').trim() || style.fontFamily;
      const heading = style.getPropertyValue('--font-headline').trim() || body;
      document.documentElement.style.setProperty('--body-font', `${body}, 'PT Sans', ui-sans-serif, system-ui, sans-serif`);
      document.documentElement.style.setProperty('--heading-font', `${heading}, 'Poppins', ui-sans-serif, system-ui, sans-serif`);
      return rules.length > 0;
    },
    render(state) {
      text('#module', state.module);
      text('#chapter', state.chapter);
      $('#app').style.transform = `translate(${state.zoom.tx}px, ${state.zoom.ty}px) scale(${state.zoom.s})`;
      text('#note .kicker', state.note?.kicker); text('#note h2', state.note?.title); text('#note p', state.note?.text);
      show($('#note'), state.note?.opacity);
      $('#note').style.transform = `translateY(${(1 - (state.note?.opacity ?? 0)) * 10}px)`;
      text('#postit p', state.postit?.text);
      show($('#postit'), state.postit?.opacity);
      const steps = JSON.stringify(state.steps);
      if (steps !== lastSteps) {
        lastSteps = steps;
        $('#progress').innerHTML = (state.steps || []).map(step => `<span class="${step}"></span>`).join('');
      }
      text('#subtitle', state.subtitle?.text);
      show($('#subtitle'), state.subtitle?.text ? state.subtitle.opacity : 0);
      const highlight = $('#highlight');
      if (state.highlight?.rect) {
        const { x, y, w, h } = state.highlight.rect;
        highlight.setAttribute('x', x - 6); highlight.setAttribute('y', y - 6); highlight.setAttribute('width', w + 12); highlight.setAttribute('height', h + 12);
      }
      show(highlight, state.highlight?.rect ? state.highlight.opacity : 0);
      const arrow = $('#arrow');
      if (state.arrow?.from && state.arrow?.to) {
        const { from, to } = state.arrow;
        const bend = Math.min(160, Math.abs(from.x - to.x) * 0.45);
        arrow.setAttribute('d', `M ${from.x} ${from.y} C ${from.x - bend} ${from.y}, ${to.x + bend} ${to.y}, ${to.x} ${to.y}`);
        const length = arrow.getTotalLength();
        arrow.style.strokeDasharray = `${length}`;
        arrow.style.strokeDashoffset = `${length * (1 - (state.arrow.progress ?? 1))}`;
      }
      show(arrow, state.arrow?.from ? state.arrow.opacity : 0);
      const cursor = $('#cursor');
      cursor.style.transform = `translate(${state.cursor.x - 3}px, ${state.cursor.y - 2}px) scale(${state.cursor.pressed ? 0.88 : 1})`;
      show(cursor, state.cursor.visible ? 1 : 0);
      const halo = $('#halo');
      halo.style.left = `${state.cursor.x}px`; halo.style.top = `${state.cursor.y}px`;
      halo.style.transform = `scale(${0.35 + (state.cursor.halo ?? 0) * 0.9})`;
      show(halo, state.cursor.halo ? (1 - state.cursor.halo) * 0.95 : 0);
      text('#card .kicker', state.card?.kicker); text('#card h1', state.card?.title); text('#card p', state.card?.text);
      const items = (state.card?.items || []).map(item => `<li>${item.replace(/[<>&]/g, char => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[char])}</li>`).join('');
      if ($('#card ul').innerHTML !== items) $('#card ul').innerHTML = items;
      show($('#card'), state.card?.opacity);
    },
  };
</script>
</body>
</html>
