<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face { font-family: Poppins; font-weight: 600; src: url(fonts/poppins-600.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 700; src: url(fonts/poppins-700.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 500; src: url(fonts/poppins-500.woff2) format('woff2'); }
@font-face { font-family: 'PT Sans'; font-weight: 400; src: url(fonts/ptsans-400.woff2) format('woff2'); }
@font-face { font-family: 'PT Sans'; font-weight: 700; src: url(fonts/ptsans-700.woff2) format('woff2'); }
:root { --ink: #0b1b33; --blue: #2563eb; --sky: #7dd3fc; --paper: #f8fafc; --mist: #eff6ff; --line: #dbeafe; --muted: #475569; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--paper); }
body { font-family: 'PT Sans', system-ui, sans-serif; color: var(--ink); position: relative; }
#bg { position: absolute; inset: 0; background: radial-gradient(120% 90% at 0% 0%, #e8f1ff 0%, rgba(232,241,255,0) 55%), radial-gradient(90% 80% at 100% 100%, #e0f2fe 0%, rgba(224,242,254,0) 60%), var(--paper); }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
#b1 { width: 46%; height: 46%; background: #bfdbfe; } #b2 { width: 38%; height: 38%; background: #bae6fd; } #b3 { width: 30%; height: 30%; background: #c7d2fe; opacity: .35; }
.layer { position: absolute; inset: 0; opacity: 0; }
.backdrop { position: absolute; inset: -40px; background-size: cover; background-position: center top; filter: blur(16px) saturate(1.1); opacity: .32; }
.veil { position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 45%, rgba(248,250,252,.92) 0%, rgba(248,250,252,.55) 70%, rgba(248,250,252,.35) 100%); }
.url { position: absolute; font-family: 'PT Sans', sans-serif; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.window { position: absolute; border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 40px 90px -30px rgba(15,37,80,.45), 0 0 0 1px rgba(15,37,80,.08); }
.window .bar { position: absolute; left: 0; right: 0; top: 0; height: 34px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 8px; padding-left: 16px; z-index: 2; }
.window .bar i { width: 11px; height: 11px; border-radius: 50%; background: #cbd5e1; display: block; }
.window .view { position: absolute; left: 0; right: 0; bottom: 0; top: 34px; overflow: hidden; }
.window .view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.spot { position: absolute; border-radius: 14px; box-shadow: 0 0 0 4px rgba(37,99,235,.9), 0 0 0 9999px rgba(11,27,51,.18); pointer-events: none; }
.chip { position: absolute; display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px 12px 18px; border-radius: 999px; background: rgba(255,255,255,.85); box-shadow: 0 10px 30px -18px rgba(15,37,80,.5), 0 0 0 1px rgba(37,99,235,.12); font-family: Poppins, sans-serif; font-weight: 600; letter-spacing: .01em; color: var(--ink); }
.chip b { width: 12px; height: 12px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 5px rgba(37,99,235,.15); }
.headline { position: absolute; font-family: Poppins, sans-serif; font-weight: 700; letter-spacing: -.02em; line-height: 1.08; color: var(--ink); }
.headline .w { display: inline-block; opacity: 0; transform: translateY(18px); }
.sub { position: absolute; font-family: 'PT Sans', sans-serif; color: var(--muted); line-height: 1.35; }
.caption { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; text-align: center; color: #fff; background: rgba(11,27,51,.84); border-radius: 18px; padding: 14px 26px; font-family: 'PT Sans', sans-serif; font-weight: 700; line-height: 1.3; }
.logo { position: absolute; display: flex; align-items: center; gap: 22px; }
.logo img { border-radius: 26%; box-shadow: 0 20px 50px -20px rgba(15,37,80,.55); }
.logo span { font-family: Poppins, sans-serif; font-weight: 700; letter-spacing: .02em; color: var(--ink); }
.cta { position: absolute; font-family: Poppins, sans-serif; font-weight: 600; color: #fff; background: var(--blue); border-radius: 999px; box-shadow: 0 18px 40px -16px rgba(37,99,235,.7); }
.bar-progress { position: absolute; height: 6px; border-radius: 3px; background: var(--blue); }
</style></head>
<body>
<div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div></div>
<div id="layers"></div>
<div id="caption" class="caption" style="opacity:0"></div>
<script>
const params = new URLSearchParams(location.search);
const W = Number(params.get('w') || 1920), H = Number(params.get('h') || 1080);
document.documentElement.style.setProperty('--W', W + 'px');
document.documentElement.style.setProperty('--H', H + 'px');
const V = H > W; // vertical
const S = Math.min(W, H) / 1080; // type scale
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const out = t => 1 - Math.pow(1 - t, 3);
const lerp = (a, b, t) => a + (b - a) * t;
let TL = null; const built = [];

function words(el, text, size) {
  el.innerHTML = text.split(' ').map(w => `<span class="w">${w}</span>`).join(' ');
  el.style.fontSize = size + 'px';
}
function makeWindow(src, box) {
  const win = document.createElement('div'); win.className = 'window';
  Object.assign(win.style, { left: box.x + 'px', top: box.y + 'px', width: box.w + 'px', height: box.h + 'px' });
  win.innerHTML = `<div class="bar"><i></i><i></i><i></i></div><div class="view"><img src="stills/${src}"></div>`;
  return win;
}
/** Builds each block's layer once; renderAt only moves things. */
function build(timeline) {
  TL = timeline;
  const root = document.getElementById('layers');
  for (const block of timeline.blocks) {
    const layer = document.createElement('div'); layer.className = 'layer'; root.appendChild(layer);
    const parts = { layer };
    if (block.type === 'cover' || block.type === 'end') {
      if (block.backdrop) { const bd = document.createElement('div'); bd.className = 'backdrop'; bd.style.backgroundImage = `url(stills/${block.backdrop})`; layer.appendChild(bd); parts.backdrop = bd; const veil = document.createElement('div'); veil.className = 'veil'; layer.appendChild(veil); }
      const logo = document.createElement('div'); logo.className = 'logo';
      logo.innerHTML = `<img src="icon.png" width="${Math.round(120*S)}" height="${Math.round(120*S)}"><span style="font-size:${Math.round(96*S)}px">ANTON.IA</span>`;
      layer.appendChild(logo); parts.logo = logo;
      const head = document.createElement('div'); head.className = 'headline'; words(head, block.headline || '', Math.round((V ? 66 : 64) * S)); layer.appendChild(head); parts.head = head;
      if (block.type === 'end') { const cta = document.createElement('div'); cta.className = 'cta'; cta.textContent = block.cta || 'Agenda una demo'; cta.style.fontSize = Math.round(40*S)+'px'; cta.style.padding = `${Math.round(22*S)}px ${Math.round(46*S)}px`; layer.appendChild(cta); parts.cta = cta; }
      if (block.url) { const url = document.createElement('div'); url.className = 'url'; url.textContent = block.url; url.style.fontSize = Math.round(34*S)+'px'; layer.appendChild(url); parts.url = url; }
    } else if (block.type === 'statement') {
      const head = document.createElement('div'); head.className = 'headline'; words(head, block.headline, Math.round((V ? 92 : 96) * S)); layer.appendChild(head); parts.head = head;
      if (block.sub) { const sub = document.createElement('div'); sub.className = 'sub'; sub.textContent = block.sub; sub.style.fontSize = Math.round(40*S)+'px'; layer.appendChild(sub); parts.sub = sub; }
    } else if (block.type === 'screen' || block.type === 'screens') {
      const shots = block.type === 'screens' ? block.shots : [{ still: block.still, from: block.from, to: block.to, spot: block.spot }];
      // vertical: a tall window that crops the page around the camera, so the app reads at phone size
      const box = V ? { x: 40, y: 470, w: W - 80, h: 1060 }
        : block.side === false ? { x: 160, y: 120, w: W - 320, h: H - 240 } : { x: Math.round(W * 0.36), y: 150, w: Math.round(W * 0.6), h: Math.round(W * 0.6 * 900 / 1440) + 34 };
      parts.box = box; parts.wins = shots.map(shot => { const win = makeWindow(shot.still, box); layer.appendChild(win); const spot = document.createElement('div'); spot.className = 'spot'; spot.style.opacity = 0; win.querySelector('.view').appendChild(spot); return { win, img: win.querySelector('img'), shot, spot }; });
      const chip = document.createElement('div'); chip.className = 'chip'; chip.innerHTML = `<b></b>${block.chip || ''}`; chip.style.fontSize = Math.round(30*S)+'px';
      if (block.chip) layer.appendChild(chip); parts.chip = chip;
      const head = document.createElement('div'); head.className = 'headline'; words(head, block.headline || '', Math.round((V ? 74 : 64) * S)); layer.appendChild(head); parts.head = head;
      if (block.sub) { const sub = document.createElement('div'); sub.className = 'sub'; sub.textContent = block.sub; sub.style.fontSize = Math.round((V ? 36 : 30)*S)+'px'; layer.appendChild(sub); parts.sub = sub; }
    } else if (block.type === 'mosaic') {
      parts.tiles = block.stills.map((still, i) => { const w = V ? 440 : 520, h = Math.round(w * 900 / 1440) + 34; const col = i % (V ? 2 : 3), row = Math.floor(i / (V ? 2 : 3));
        const box = V ? { x: 70 + col * 500, y: 380 + row * 360, w, h } : { x: 150 + col * 560, y: 170 + row * 400, w, h };
        const win = makeWindow(still, box); layer.appendChild(win); return { win, box, i }; });
      const head = document.createElement('div'); head.className = 'headline'; words(head, block.headline || '', Math.round(72 * S)); layer.appendChild(head); parts.head = head;
    }
    built.push(parts);
  }
}
function revealWords(el, u, start, per) {
  const spans = el.querySelectorAll('.w');
  spans.forEach((span, i) => { const p = clamp((u - start - i * per) / 0.45, 0, 1); span.style.opacity = out(p); span.style.transform = `translateY(${(1 - out(p)) * 18}px)`; });
}
function camera(img, view, from, to, p) {
  // from/to: { x, y, z } center in the still (0..1) and zoom (1 = whole still fits the view width)
  const vw = view.clientWidth, vh = view.clientHeight;
  // never smaller than the view: a tall window needs more zoom to be filled
  const z = Math.max(lerp(from.z, to.z, p), vh / (vw * 1800 / 2880)), cx = lerp(from.x, to.x, p), cy = lerp(from.y, to.y, p);
  const base = vw / 2880, s = base * z;
  const iw = 2880 * s, ih = 1800 * s;
  let tx = vw / 2 - cx * iw, ty = vh / 2 - cy * ih;
  tx = clamp(tx, vw - iw, 0); ty = clamp(ty, Math.min(0, vh - ih), 0);
  img.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  return { tx, ty, s };
}
function renderAt(t) {
  // background drift
  const d = t / 30;
  Object.assign(document.getElementById('b1').style, { left: `${-8 + Math.sin(d) * 6}%`, top: `${-10 + Math.cos(d * .8) * 5}%` });
  Object.assign(document.getElementById('b2').style, { left: `${68 + Math.cos(d * .7) * 6}%`, top: `${62 + Math.sin(d) * 5}%` });
  Object.assign(document.getElementById('b3').style, { left: `${40 + Math.sin(d * .5) * 10}%`, top: `${30 + Math.cos(d * .6) * 8}%` });
  let caption = null;
  TL.blocks.forEach((block, i) => {
    const parts = built[i]; const u = t - block.start; const dur = block.duration;
    const fade = Math.min(0.45, dur / 4);
    const vis = u < -0.01 || u > dur + 0.01 ? 0 : Math.min(clamp(u / fade, 0, 1), clamp((dur - u) / fade, 0, 1));
    parts.layer.style.opacity = vis; parts.layer.style.display = vis <= 0 ? 'none' : 'block';
    if (vis <= 0) return;
    for (const cue of block.cues || []) {
      if (u >= cue.from && u < cue.to) { caption = { text: cue.text, a: clamp((u - cue.from) / .2, 0, 1) * clamp((cue.to - u) / .2, 0, 1) }; break; }
    }
    if (block.type === 'cover' || block.type === 'end') {
      const p = out(clamp(u / 1.1, 0, 1));
      const logoW = parts.logo.getBoundingClientRect().width;
      Object.assign(parts.logo.style, { left: `${(W - logoW) / 2}px`, top: `${H * (V ? 0.36 : 0.32) + (1 - p) * 30}px`, opacity: p });
      const hw = Math.min(W - 160, V ? 900 : 1300); Object.assign(parts.head.style, { width: hw + 'px', left: `${(W - hw) / 2}px`, top: `${H * (V ? 0.47 : 0.52)}px`, textAlign: 'center' });
      revealWords(parts.head, u, 0.7, 0.09);
      if (parts.backdrop) parts.backdrop.style.transform = `scale(${1.04 + 0.04 * clamp(u / dur, 0, 1)})`;
      if (parts.url) { const c = out(clamp((u - 2.0) / .6, 0, 1)); const uw = parts.url.getBoundingClientRect().width; Object.assign(parts.url.style, { left: `${(W - uw) / 2}px`, top: `${H * (V ? 0.70 : 0.82)}px`, opacity: c }); }
      if (parts.cta) { const c = out(clamp((u - 1.6) / .6, 0, 1)); const cw = parts.cta.getBoundingClientRect().width; Object.assign(parts.cta.style, { left: `${(W - cw) / 2}px`, top: `${H * (V ? 0.62 : 0.7) + (1 - c) * 20}px`, opacity: c }); }
    } else if (block.type === 'statement') {
      const hw = Math.min(W - 160, V ? 920 : 1500); Object.assign(parts.head.style, { width: hw + 'px', left: `${(W - hw) / 2}px`, top: `${H * (V ? 0.36 : 0.36)}px`, textAlign: 'center' });
      revealWords(parts.head, u, 0.2, 0.11);
      if (parts.sub) { const p = out(clamp((u - 1.2) / .6, 0, 1)); Object.assign(parts.sub.style, { width: hw + 'px', left: `${(W - hw) / 2}px`, top: `${H * (V ? 0.58 : 0.62)}px`, textAlign: 'center', opacity: p }); }
    } else if (block.type === 'screen' || block.type === 'screens') {
      const n = parts.wins.length; const each = dur / n;
      parts.wins.forEach(({ win, img, shot, spot }, k) => {
        const local = u - k * each; const p = ease(clamp(local / each, 0, 1));
        // a true cross-fade: the next shot comes in on top while this one stays whole under it, so the window never blinks empty
        const XF = 0.45;
        const show = n === 1 ? 1 : local < (k === 0 ? 0 : -XF) || local >= each + (k === n - 1 ? 1 : 0) ? 0 : k === 0 ? 1 : clamp((local + XF) / XF, 0, 1);
        win.style.opacity = show; win.style.transform = `translateY(${(1 - out(clamp(u / .8, 0, 1))) * 40}px)`;
        const cam = camera(img, win.querySelector('.view'), shot.from || { x: .5, y: .5, z: 1 }, shot.to || { x: .5, y: .5, z: 1.15 }, p);
        if (shot.spot) {
          const r = shot.spot; const a = clamp((local - each * 0.4) / .5, 0, 1) * clamp((each - local) / .4, 0, 1);
          Object.assign(spot.style, { left: `${cam.tx + r.x * 2880 * cam.s - 8}px`, top: `${cam.ty + r.y * 1800 * cam.s - 8}px`, width: `${r.w * 2880 * cam.s + 16}px`, height: `${r.h * 1800 * cam.s + 16}px`, opacity: a });
        }
      });
      const box = parts.box;
      if (V) {
        Object.assign(parts.chip.style, { left: '60px', top: '130px' });
        Object.assign(parts.head.style, { left: '60px', top: '215px', width: `${W - 120}px` });
        if (parts.sub) Object.assign(parts.sub.style, { left: '60px', top: `${box.y + box.h + 50}px`, width: `${W - 120}px`, opacity: out(clamp((u - .9) / .6, 0, 1)) });
      } else if (block.side === false) {
        Object.assign(parts.chip.style, { left: `${box.x}px`, top: '44px' });
        Object.assign(parts.head.style, { left: `${box.x + 380}px`, top: '44px', width: '1200px', fontSize: Math.round(46 * S) + 'px' });
      } else {
        Object.assign(parts.chip.style, { left: '110px', top: '230px' });
        Object.assign(parts.head.style, { left: '110px', top: '320px', width: `${box.x - 170}px` });
        if (parts.sub) Object.assign(parts.sub.style, { left: '110px', top: `${320 + parts.head.getBoundingClientRect().height + 36}px`, width: `${box.x - 190}px`, opacity: out(clamp((u - .9) / .6, 0, 1)) });
      }
      parts.chip.style.opacity = out(clamp(u / .5, 0, 1));
      revealWords(parts.head, u, 0.25, 0.07);
    } else if (block.type === 'mosaic') {
      parts.tiles.forEach(({ win, box, i }) => {
        const p = out(clamp((u - i * 0.18) / .8, 0, 1)); const drift = Math.sin((t + i) / 3) * 6;
        Object.assign(win.style, { opacity: p, transform: `translateY(${(1 - p) * 50 + drift}px) scale(${0.96 + 0.04 * p})` });
        const img = win.querySelector('img'); camera(img, win.querySelector('.view'), { x: .5, y: .3, z: 1 }, { x: .5, y: .35, z: 1.08 }, clamp(u / dur, 0, 1));
      });
      const hw = W - 240; Object.assign(parts.head.style, { width: hw + 'px', left: '120px', top: V ? '170px' : '60px', textAlign: 'center' });
      revealWords(parts.head, u, 0.4, 0.08);
    }
  });
  const cap = document.getElementById('caption');
  if (TL.captions && caption) {
    cap.textContent = caption.text; cap.style.opacity = caption.a;
    Object.assign(cap.style, { bottom: V ? '150px' : '48px', maxWidth: V ? `${W - 120}px` : '1500px', fontSize: Math.round((V ? 44 : 34) * S) + 'px' });
  } else cap.style.opacity = 0;
}
async function ready() {
  await document.fonts.ready;
  await Promise.all([...document.images].map(img => img.complete ? null : new Promise(done => { img.onload = img.onerror = done; })));
  const bds = [...document.querySelectorAll('.backdrop')].map(el => el.style.backgroundImage.slice(5, -2));
  await Promise.all(bds.map(src => new Promise(done => { const i = new Image(); i.onload = i.onerror = done; i.src = src; })));
  return [...document.images].filter(img => !img.naturalWidth).map(img => img.getAttribute('src'));
}
window.__build = build; window.__renderAt = renderAt; window.__ready = ready;
</script></body></html>
