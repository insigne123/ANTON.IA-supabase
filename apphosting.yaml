  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlmZGVsZmxzaGV1cnphaWN3YXlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkxNzQ3NTYsImV4cCI6MjA3NDc1MDc1Nn0.V-1iPr7r-KorFVWPriopLW2aDGT6__6-DFHcNq-D7o4"
