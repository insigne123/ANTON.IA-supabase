    value: gmeneses@grupoexpro.com,lgordo@grupoexpro.com,cortega@grupoexpro.com,ribanez@grupoexpro.com,laramirez@grupoexpro.com,kmory@grupoexpro.com,nicolas.yarur.g@yago.cl,cflores@grupoexpro.com,rperezm@grupoexpro.com,sgutierrez@grupoexpro.com,cmoya@grupoexpro.com,malvarado@grupoexpro.com,cmolina@grupoexpro.com,mcoloma@grupoexpro.com,cpizarro@grupoexpro.com,fneira@grupoexpro.com,fperalta@grupoexpro.com,dmanriquez@grupoexpro.com,ptapia@grupoexpro.com,casenjo@grupoexpro.com,drey@grupoexpro.com,kgomez@grupoexpro.com,josorio@grupoexpro.com,culloag@grupoexpro.com,kzorrilla@grupoexpro.com,jfranco@grupoexpro.com,dpinzon@grupoexpro.com,ddevia@grupoexpro.com
