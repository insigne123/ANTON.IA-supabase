    secret: SERPER_API_KEY
    availability: [RUNTIME]

  - variable: NATIVE_RESEARCH_ENABLED
    value: "true"
    availability: [RUNTIME]

  - variable: SERPER_TIMEOUT_MS
    value: "6000"
    availability: [RUNTIME]

  - variable: SERPER_MAX_RETRIES
