# apphosting.yaml

runConfig:
  minInstances: 0
  maxInstances: 20
  concurrency: 100
  cpu: 1
  memoryMiB: 768

env:
  # Cowork private pilot: visible solo para nicolas.yarur.g@yago.cl (gate en código + grant DB).
  - variable: COWORK_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_OWNER_USER_ID
    value: de3a3194-29b1-449a-828a-53608a7ebe47
    availability: [RUNTIME]
  - variable: COWORK_WORKER_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]
  # Rescate (Plan 14, 2): una sola respuesta de este modelo cuando un turno iba a fallar. Luna, como todo (regla del dueño, 8 oct);
  # nunca astra.
  - variable: COWORK_RESCUE_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]
  - variable: COWORK_PROVIDER
    value: openai
    availability: [RUNTIME]
  - variable: COWORK_WORKER_SECRET
    secret: COWORK_WORKER_SECRET
    availability: [RUNTIME]
  # El workspace abierto despierta al worker (POST /api/cowork/wake) para no
  # esperar el cron de 1 minuto. "false" vuelve a depender solo del cron.
  - variable: COWORK_INLINE_WAKE
    value: "true"
    availability: [RUNTIME]
  # Fase 0 plan Cowork: búsqueda externa, investigación, borradores y versiones.
  # Autonomía sigue desactivada (COWORK_AUTONOMY_ENABLED ausente = false).
  - variable: COWORK_EXTERNAL_SEARCH_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_RESEARCH_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_NATIVE_DRAFTS_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_DOCUMENT_VERSIONS_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Fase 4: coordinación (planes/cola/especialistas) y presupuestos agregados.
  # La autonomía general sigue desactivada (COWORK_AUTONOMY_ENABLED ausente).
  # Todos los efectos nuevos requieren revisión humana explícita.
  - variable: COWORK_OPERATION_LEASES_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_SPECIALISTS_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_SPECIALIST_QUEUE_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_MODEL_BUDGET_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_SPECIALIST_TOOLS_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_MODEL_USAGE_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Borrador en vivo y Redactora/Revisora: M1 y M2 verificadas en producción.
  - variable: COWORK_STREAMING_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Una sola respuesta: se muestra cuando ya pasó la revisión, sin texto que después cambie a la
  # vista (docs/cowork-una-respuesta.md). En "false" vuelve el texto en vivo.
  - variable: COWORK_ANSWER_HOLD_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_WRITER_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Plan 12: consultas ofrecidas en el turno y tableros/gráficos en el lienzo.
  # Sin migración adicional; cowork-artifacts privado verificado el 6 oct 2026.
  - variable: COWORK_OFFERED_READS_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Plan 13: estado propio de la cuenta en paralelo, solo lectura y tope de 2,5 s.
  # Apagarlo si añade latencia a los turnos. Reasoning effort se deja sin definir (low por defecto).
  - variable: COWORK_WORKSPACE_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_CODE_ARTIFACTS_ENABLED
    value: "true"
    availability: [RUNTIME]
  # memory_save aplicado y verificado en producción (20261006182758).
  - variable: COWORK_PREFERENCES_ENABLED
    value: "true"
    availability: [RUNTIME]
  # El dueño autorizó estas funciones; los efectos conservan sus tarjetas de aprobación.
  - variable: COWORK_REPLY_THREAD_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_CONTACTS_IMPORT_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Tareas largas (Plan 13, 4c): la migración 20261007120000 (task_plan) está aplicada y verificada en producción (2026-10-07).
  # Para apagarlas: value "false" y redeploy; no hace falta tocar la base.
  - variable: COWORK_TASKS_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Activación solicitada por el dueño el 9 oct: SQL de aclaraciones/fencing
  # aplicado y permisos/RLS/logs verificados. Supervisor v2 comprobado con Docker
  # real; activar la app después de instalar el cierre de inputs tras reinicio.
  - variable: COWORK_TASK_GRAPH_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_CLARIFICATIONS_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_CODE_FENCING_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_EXECUTOR_ASYNC_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_BUILD_WORKSPACES_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Lotes autorizados, pendientes de prueba real guiada con un contacto.
  - variable: COWORK_LINKEDIN_BATCH_ENABLED
    value: "false"
    availability: [RUNTIME]
  # Flags experimentales descartados o con medición todavía insuficiente.
  - variable: COWORK_ANALYST_ENABLED
    value: "false"
    availability: [RUNTIME]
  - variable: COWORK_INTENT_PROMPTS_ENABLED
    value: "false"
    availability: [RUNTIME]
  # Jueza apagada: revisa la respuesta después de mostrarla y la reemplaza a la vista.
  # Vuelve cuando revise antes de mostrar (docs/cowork-jueza.md).
  - variable: COWORK_JUDGE_ENABLED
    value: "false"
    availability: [RUNTIME]
  # Reintento de envíos fallidos de campaña (docs/cowork-reintentar-envios.md).
  # Requiere la migración 20260930170000 ya aplicada en producción.
  # Apagarlo también detiene un reintento ya aprobado.
  - variable: COWORK_CAMPAIGN_RETRY_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Revelado de teléfono con costo por contacto (docs/cowork-revelar-telefono.md).
  # 10 créditos por teléfono aprobado; el proveedor lo entrega después por webhook.
  # Apagarlo también detiene un pedido ya aprobado.
  - variable: COWORK_PHONE_REVEAL_ENABLED
    value: "true"
    availability: [RUNTIME]
  # OpenAI Standard, short-context (<272K input), USD per million tokens.
  # gpt-6.1-sol checked against https://developers.openai.com/api/docs/pricing on 2026-10-07.
  - variable: COWORK_MODEL_PRICING_JSON
    value: '{"gpt-6-luna":{"version":"openai-standard-2026-09-23-short","inputUsdPerMillion":0.1,"outputUsdPerMillion":0.5,"cachedInputUsdPerMillion":0.01},"gpt-6-sol":{"version":"openai-standard-2026-09-23-short","inputUsdPerMillion":2,"outputUsdPerMillion":10,"cachedInputUsdPerMillion":0.2},"gpt-6.1-sol":{"version":"openai-standard-2026-10-07-short","inputUsdPerMillion":2,"outputUsdPerMillion":10,"cachedInputUsdPerMillion":0.1}}'
    availability: [RUNTIME]
  # Fase 3: ejecutor remoto de código. Secreto COWORK_EXECUTOR_SECRET en
  # Secret Manager (versión 3 = bearer exacto de la VM). No guardar valores
  # en el repo. Sin secreto o sin URL la ejecución falla cerrado.
  - variable: COWORK_EXECUTOR_URL
    value: "https://ocr-test.yago.cl/cowork-exec"
    availability: [RUNTIME]
  - variable: COWORK_EXECUTOR_SECRET
    secret: COWORK_EXECUTOR_SECRET
    availability: [RUNTIME]
  # === Primary production providers ===
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability: [RUNTIME]

  - variable: OPENAI_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_EMAIL_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_FAST_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_BALANCED_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_ORCHESTRATOR_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  # Borradores de cuentas prioridad A: luna con esfuerzo medio, medido a ciegas contra sol (docs/borradores-luna.md).
  - variable: OPENAI_REASONING_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: NATIVE_RESEARCH_REPORT_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_CRITICAL_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_FALLBACK_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: AI_PROVIDER
    value: openai
    availability: [RUNTIME]

  - variable: ADMIN_DASHBOARD_ALLOWED_EMAILS
    value: gmeneses@grupoexpro.com,nicolas.yarur.g@yago.cl
    availability: [RUNTIME]
  # Cross-company read-only analytics, separate from company roles and credit operators.
  - variable: ADMIN_USAGE_PLATFORM_USER_IDS
    value: de3a3194-29b1-449a-828a-53608a7ebe47
