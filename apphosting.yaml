# apphosting.yaml

runConfig:
  minInstances: 0
  maxInstances: 20
  concurrency: 100
  cpu: 1
  memoryMiB: 768

env:
  # Build only: «next build» checks types with the default heap (~2 GB) and ran out of memory on 14 oct 2026.
  - variable: NODE_OPTIONS
    value: --max-old-space-size=4096
    availability: [BUILD]
  # Cowork abierto a todas las cuentas desde el 19 oct 2026 (COWORK_OPEN_TO_ALL): cada persona recibe su grant la primera
  # vez que entra; un grant apagado por un administrador sigue apagado. Sin COWORK_OPEN_TO_ALL vuelve al piloto privado:
  # el dueño y la cuenta QA (lista fija en src/lib/cowork/access.ts + grant DB).
  - variable: COWORK_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_OPEN_TO_ALL
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_OWNER_USER_ID
    value: de3a3194-29b1-449a-828a-53608a7ebe47
    availability: [RUNTIME]
  # Además del dueño: la cuenta QA (nicolas.yarur.g+qa@yago.cl), 16 oct 2026. Separados por coma; solo ids de correos permitidos.
  - variable: COWORK_ALLOWED_USER_IDS
    value: 9f7776c6-b4c4-4e5c-9acc-58fcb1f5b4ad
    availability: [RUNTIME]
  - variable: COWORK_WORKER_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]
  # Rescate (Plan 14, 2): una sola respuesta de este modelo cuando un turno iba a fallar. Luna, como todo (regla del dueño, 8 oct);
  # nunca astra.
  - variable: COWORK_RESCUE_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]
  - variable: COWORK_PROVIDER
    value: openai
    availability: [RUNTIME]
  - variable: COWORK_WORKER_SECRET
    secret: COWORK_WORKER_SECRET
    availability: [RUNTIME]
  # El workspace abierto despierta al worker (POST /api/cowork/wake) para no
  # esperar el cron de 1 minuto. "false" vuelve a depender solo del cron.
  - variable: COWORK_INLINE_WAKE
    value: "true"
    availability: [RUNTIME]
  # Fase 0 plan Cowork: búsqueda externa, investigación, borradores y versiones.
  # La autonomía (modo «Autónomo» del compositor) se enciende más abajo, con las demás funciones del 24 oct 2026.
  - variable: COWORK_EXTERNAL_SEARCH_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_RESEARCH_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_NATIVE_DRAFTS_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_DOCUMENT_VERSIONS_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Fase 4: coordinación (planes/cola/especialistas) y presupuestos agregados.
  # Todos los efectos nuevos requieren revisión humana explícita; la lista de los que el modo autónomo aprueba solo está en
  # src/lib/cowork/execution-policy.ts (AUTOMATIC_EFFECTS) y los envíos, las activaciones y las notas nunca están en ella.
  - variable: COWORK_OPERATION_LEASES_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_SPECIALISTS_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_SPECIALIST_QUEUE_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_MODEL_BUDGET_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_SPECIALIST_TOOLS_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_MODEL_USAGE_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Borrador en vivo y Redactora/Revisora: M1 y M2 verificadas en producción.
  - variable: COWORK_STREAMING_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Texto en vivo (25 oct): con la Jueza apagada nada cambia una respuesta común después de escrita,
  # así que se ve mientras se escribe. Los correos de la Redactora se retienen igual hasta que la
  # Revisora termina: en producción cambió 7 de 10 (docs/cowork-una-respuesta.md). En "true" se
  # retiene todo, como antes.
  - variable: COWORK_ANSWER_HOLD_ENABLED
    value: "false"
    availability: [RUNTIME]
  - variable: COWORK_WRITER_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Plan 12: consultas ofrecidas en el turno y tableros/gráficos en el lienzo.
  # Sin migración adicional; cowork-artifacts privado verificado el 6 oct 2026.
  - variable: COWORK_OFFERED_READS_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Plan 13: estado propio de la cuenta en paralelo, solo lectura y tope de 2,5 s.
  # Apagarlo si añade latencia a los turnos. Reasoning effort se deja sin definir (low por defecto).
  - variable: COWORK_WORKSPACE_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_CODE_ARTIFACTS_ENABLED
    value: "true"
    availability: [RUNTIME]
  # memory_save aplicado y verificado en producción (20261006182758).
  - variable: COWORK_PREFERENCES_ENABLED
    value: "true"
    availability: [RUNTIME]
  # El dueño autorizó estas funciones; los efectos conservan sus tarjetas de aprobación.
  - variable: COWORK_REPLY_THREAD_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_CONTACTS_IMPORT_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Tareas largas (Plan 13, 4c): la migración 20261007120000 (task_plan) está aplicada y verificada en producción (2026-10-07).
  # Para apagarlas: value "false" y redeploy; no hace falta tocar la base.
  - variable: COWORK_TASKS_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Activación solicitada por el dueño el 9 oct: SQL de aclaraciones/fencing
  # aplicado y permisos/RLS/logs verificados. Supervisor v2 comprobado con Docker
  # real; activar la app después de instalar el cierre de inputs tras reinicio.
  - variable: COWORK_TASK_GRAPH_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_CLARIFICATIONS_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_CODE_FENCING_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_EXECUTOR_ASYNC_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_BUILD_WORKSPACES_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Lotes autorizados, pendientes de prueba real guiada con un contacto.
  - variable: COWORK_LINKEDIN_BATCH_ENABLED
    value: "false"
    availability: [RUNTIME]
  # Flags experimentales descartados o con medición todavía insuficiente.
  - variable: COWORK_ANALYST_ENABLED
    value: "false"
    availability: [RUNTIME]
  - variable: COWORK_INTENT_PROMPTS_ENABLED
    value: "false"
    availability: [RUNTIME]
  # Jueza apagada: revisa la respuesta después de mostrarla y la reemplaza a la vista.
  # Vuelve cuando revise antes de mostrar (docs/cowork-jueza.md).
  - variable: COWORK_JUDGE_ENABLED
    value: "false"
    availability: [RUNTIME]
  # Jev en sombra (docs/cowork-jev.md): requiere el secreto TYPESAFE_API_KEY
  # creado en Secret Manager con acceso de la app. Solo registra, no corrige.
  - variable: TYPESAFE_API_KEY
    secret: TYPESAFE_API_KEY
    availability: [RUNTIME]
  - variable: COWORK_JEV_SHADOW
    value: "true"
    availability: [RUNTIME]
  # Reintento de envíos fallidos de campaña (docs/cowork-reintentar-envios.md).
  # Requiere la migración 20260930170000 ya aplicada en producción.
  # Apagarlo también detiene un reintento ya aprobado.
  - variable: COWORK_CAMPAIGN_RETRY_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Revelado de teléfono con costo por contacto (docs/cowork-revelar-telefono.md).
  # 10 créditos por teléfono aprobado; el proveedor lo entrega después por webhook.
  # Apagarlo también detiene un pedido ya aprobado.
  - variable: COWORK_PHONE_REVEAL_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Mejoras encendidas para todas las cuentas desde el 24 oct 2026, por decisión del dueño (la evidencia está en docs/borradores-ganchos-y-reglas.md,
  # docs/senales-de-la-investigacion-al-correo.md y docs/piloto-borradores-cowork-2026-10-23.md). Ninguna usa un modelo caro: solo Haiku 5.5 y Luna
  # (Opus y Sonnet están bloqueados en src/ai/blocked-models.ts). El mismo día se encendieron la web de Claude, los subagentes, la lectura de documentos
  # con visión y el modo autónomo, tras probarlos (docs/funciones-apagadas-encendidas-2026-10-24.md).
  # Borradores: las señales de la investigación llegan al correo, los ganchos no aptos no llegan al redactor y el hecho conserva su dato concreto.
  - variable: DRAFT_SIGNAL_EVIDENCE_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: DRAFT_HOOK_FILTER_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: DRAFT_ANCHOR_SPECIFICS_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Investigación: un Claude (Haiku) elige, entre los hechos que la investigación ya leyó, las señales recientes que sirven de motivo para escribir;
  # solo se aceptan las que están escritas en los hechos que citan. Cuesta del orden de US$0,001 por investigación y suma unos segundos.
  - variable: RESEARCH_SIGNAL_HARVEST_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Cowork: el harness (el coordinador es un Claude con herramientas) con Haiku 5.5, y las tareas programadas (cada persona decide si crea una; hasta 5 activas).
  - variable: COWORK_RUNTIME
    value: harness
    availability: [RUNTIME]
  - variable: COWORK_HARNESS_MODEL
    value: claude-haiku-5-5
    availability: [RUNTIME]
  - variable: COWORK_SCHEDULES_ENABLED
    value: "true"
    availability: [RUNTIME]
  # La web de Claude (Anthropic corre la búsqueda y la lectura de páginas), con Haiku 5.5 y las herramientas básicas: las de filtrado dinámico fallan con
  # Haiku («invalid_tool_input» en cada búsqueda). Una búsqueda cuesta US$0,01 y cada turno tiene su tope (4 búsquedas y 3 lecturas; las Investigadoras,
  # 3 y 2 cada una, hasta 3 por turno); el precio de la búsqueda va en COWORK_MODEL_PRICING_JSON. Si Anthropic rechaza las herramientas web, el turno
  # sigue con el bucle de siempre y la web se pausa 10 minutos (src/lib/cowork/web-breaker.ts).
  - variable: COWORK_WEB_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: COWORK_WEB_BASIC
    value: "true"
    availability: [RUNTIME]
  # Las Investigadoras: el coordinador reparte la investigación de varias empresas y ellas buscan a la vez (el rol «delegate» del libro de consumo,
  # migración 20261023130000 ya aplicada en producción).
  - variable: COWORK_SUBAGENTS_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Un Claude (Haiku) mira las páginas de un documento antes de entregarlo; sin rasterizador (pdftoppm o sharp) o sin tipografías en el servidor
  # no mira y el documento sigue como antes: la revisión nunca lo bloquea.
  - variable: COWORK_DOCUMENT_VISION
    value: "true"
    availability: [RUNTIME]
  # El modo «Autónomo» aparece en el compositor (cada conversación parte «Con aprobaciones»): aprueba por la persona buscar prospectos (1 por hilo),
  # guardar contactos, investigar, pedir borradores, buscar un correo (1 crédito) y crear campañas en pausa, con tope de 3 pasos por hilo. Un turno que
  # leyó la web abierta (una búsqueda, una página o una Investigadora) no aprueba nada solo: la persona decide, como «Con aprobaciones».
  - variable: COWORK_AUTONOMY_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Investigación de leads: un Claude (Haiku) con búsqueda web elige las páginas que vale la pena leer (noticias, avisos de empleo con fecha, licitaciones);
  # la investigación las lee ella misma, y una página que no nombra a la empresa (un homónimo) no se usa. Unos US$0,05 por investigación.
  - variable: RESEARCH_CLAUDE_WEB_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Para limitar los borradores o el harness a unas pocas personas se agregan DRAFT_PILOT_USER_IDS y COWORK_HARNESS_USER_IDS (ids de usuario separados por
  # coma; la prueba exige que sean las mismas). Para volver atrás se quita la variable de la mejora y se despliega: el siguiente borrador y el siguiente
  # turno ya corren como antes.
  # OpenAI Standard, short-context (<272K input), USD per million tokens.
  # gpt-6.1-sol checked against https://developers.openai.com/api/docs/pricing on 2026-10-07.
  - variable: COWORK_MODEL_PRICING_JSON
    value: '{"gpt-6-luna":{"version":"openai-standard-2026-09-23-short","inputUsdPerMillion":0.1,"outputUsdPerMillion":0.5,"cachedInputUsdPerMillion":0.01},"gpt-6-sol":{"version":"openai-standard-2026-09-23-short","inputUsdPerMillion":2,"outputUsdPerMillion":10,"cachedInputUsdPerMillion":0.2},"gpt-6.1-sol":{"version":"openai-standard-2026-10-07-short","inputUsdPerMillion":2,"outputUsdPerMillion":10,"cachedInputUsdPerMillion":0.1},"claude-haiku-5-5":{"version":"anthropic-standard-2026-10-24-web","inputUsdPerMillion":0.1,"outputUsdPerMillion":0.5,"cachedInputUsdPerMillion":0.01,"webSearchUsdPerThousand":10}}'
    availability: [RUNTIME]
  # Fase 3: ejecutor remoto de código. Secreto COWORK_EXECUTOR_SECRET en
  # Secret Manager (versión 3 = bearer exacto de la VM). No guardar valores
  # en el repo. Sin secreto o sin URL la ejecución falla cerrado.
  - variable: COWORK_EXECUTOR_URL
    value: "https://ocr-test.yago.cl/cowork-exec"
    availability: [RUNTIME]
  - variable: COWORK_EXECUTOR_SECRET
    secret: COWORK_EXECUTOR_SECRET
    availability: [RUNTIME]
  # === Primary production providers ===
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability: [RUNTIME]

  # Platform Claude credential. Secret value is managed in Google Secret Manager;
  # only server runtime reads it. Model routing and opportunity rollout are separate.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability: [RUNTIME]

  - variable: OPENAI_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_EMAIL_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_FAST_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_BALANCED_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_ORCHESTRATOR_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  # Borradores de cuentas prioridad A: luna con esfuerzo medio, medido a ciegas contra sol (docs/borradores-luna.md).
  - variable: OPENAI_REASONING_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: NATIVE_RESEARCH_REPORT_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_CRITICAL_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: OPENAI_FALLBACK_MODEL
    value: gpt-6-luna
    availability: [RUNTIME]

  - variable: AI_PROVIDER
    value: openai
    availability: [RUNTIME]

  - variable: ADMIN_DASHBOARD_ALLOWED_EMAILS
    value: gmeneses@grupoexpro.com,nicolas.yarur.g@yago.cl
    availability: [RUNTIME]
  # Cross-company read-only analytics, separate from company roles and credit operators.
  - variable: ADMIN_USAGE_PLATFORM_USER_IDS
    value: de3a3194-29b1-449a-828a-53608a7ebe47
    availability: [RUNTIME]

  # Oportunidades: miembros actuales de GrupoExpro, verificados contra la organización en producción el 4 oct 2026.
  # El servidor exige correo confirmado y mantiene el alcance de la organización activa.
  # Las fuentes usan secretos RUNTIME de Secret Manager, con permiso del backend studio.
  - variable: OPPORTUNITIES_ALLOWED_EMAILS
    value: gmeneses@grupoexpro.com,lgordo@grupoexpro.com,cortega@grupoexpro.com,ribanez@grupoexpro.com,laramirez@grupoexpro.com,kmory@grupoexpro.com,nicolas.yarur.g@yago.cl,cflores@grupoexpro.com,rperezm@grupoexpro.com,sgutierrez@grupoexpro.com,cmoya@grupoexpro.com,malvarado@grupoexpro.com,cmolina@grupoexpro.com,mcoloma@grupoexpro.com,cpizarro@grupoexpro.com,fneira@grupoexpro.com,fperalta@grupoexpro.com,dmanriquez@grupoexpro.com,ptapia@grupoexpro.com,casenjo@grupoexpro.com,drey@grupoexpro.com,kgomez@grupoexpro.com,josorio@grupoexpro.com,culloag@grupoexpro.com,kzorrilla@grupoexpro.com,jfranco@grupoexpro.com,dpinzon@grupoexpro.com,ddevia@grupoexpro.com
    availability: [RUNTIME]
  # Five workspace migrations applied and verified on 13 Oct. The new scheduler
  # must be published by the maintainer before this configuration receives traffic.
  # Per-company automation stays off until an admin confirms that company's offer.
  - variable: OPPORTUNITIES_WORKSPACE_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: OPPORTUNITIES_AUTOMATION_ENABLED
    value: "true"
    availability: [RUNTIME]
  # El chat de cada oportunidad y el asistente de la sección buscan y leen antes de responder: un agente con Haiku 5.5 (todos los roles de
  # Oportunidades son Haiku), cada ronda un paso del libro de presupuesto de la categoría «chat». Medido con llave de prueba el 24 oct 2026:
  # el chat acierta 34 de 34 preguntas (la llamada única, 27 de 34: no encuentra lo que está fuera de los primeros fragmentos) con un costo
  # de unos US$0,0007 por pregunta (US$0,0005 la llamada única), y el asistente 7 de 7 (docs/funciones-apagadas-encendidas-2026-10-24.md). La segunda lectura del informe
  # (OPPORTUNITIES_REPORT_VERIFY) sigue apagada: no se midió con informes reales.
  - variable: OPPORTUNITIES_RUNTIME
    value: harness
    availability: [RUNTIME]
  - variable: OPPORTUNITIES_MONTHLY_USD_CAP
    value: "20"
    availability: [RUNTIME]
  # Verified from authenticated Apify metadata: FREE tier, short profile mode,
  # 1 GB run, no reactions/comments or optional profile/recruiter add-ons.
  - variable: OPPORTUNITIES_POST_USD_PER_ITEM
    value: "0.002"
    availability: [RUNTIME]
  - variable: OPPORTUNITIES_POST_START_USD
    value: "0.00005"
    availability: [RUNTIME]
  - variable: OPPORTUNITIES_POST_EMPTY_QUERY_USD
    value: "0.001"
    availability: [RUNTIME]
  # Conservative published Serper Starter replacement price: USD1/1k successful
  # responses. Existing prepaid balance only; this does not buy a USD50 top-up.
  - variable: OPPORTUNITIES_SERPER_USD_PER_REQUEST
    value: "0.001"
    availability: [RUNTIME]
  # Fantastic Jobs, cuenta nicogun123 (Free): US$0.005/aviso + US$0.01/arranque.
  # Hard cap enviado a Apify en cada corrida; solo «Buscar ahora», no el cron diario.
  - variable: APIFY_FANTASTIC_USD_PER_JOB
    value: "0.005"
    availability: [RUNTIME]
  - variable: APIFY_FANTASTIC_START_USD
    value: "0.01"
    availability: [RUNTIME]
  - variable: APIFY_FANTASTIC_MAX_RUN_USD
    value: "1"
    availability: [RUNTIME]
  - variable: APIFY_TOKEN
    secret: APIFY_TOKEN
    availability: [RUNTIME]
  # Correo cuando al plan de Apify le quedan US$0,10 o menos, y otro cuando se acaba: una vez por ciclo cada uno.
  # Lo revisa cada hora apolloUsageTick (src/lib/server/apify-credit.ts); sale por Resend.
  - variable: APIFY_LOW_CREDIT_USD
    value: "0.1"
    availability: [RUNTIME]
  - variable: APIFY_ALERT_EMAILS
    value: "nicolas.yarur.g@yago.cl"
    availability: [RUNTIME]
  - variable: JSEARCH_API_KEY
    secret: JSEARCH_API_KEY
    availability: [RUNTIME]
  - variable: MERCADO_PUBLICO_TICKET
    secret: MERCADO_PUBLICO_TICKET
    availability: [RUNTIME]
  # Plan 10: cada persona conecta su propio ticket de Mercado Público en Oportunidades. El ticket global de arriba
  # solo lo usan las cuentas confirmadas de esta lista, para sus búsquedas y las de las organizaciones que crearon.
  - variable: MERCADO_PUBLICO_SHARED_TICKET_EMAILS
    value: nicolas.yarur.g@yago.cl,gmeneses@grupoexpro.com,dsalgado@grupoexpro.com
    availability: [RUNTIME]

  # === Lead provider ===
  # Apollo runs in-process in this service: server runtime only, never BUILD,
  # so the key cannot be emitted into the browser bundle.
  - variable: APOLLO_API_KEY
    secret: APOLLO_API_KEY
    availability: [RUNTIME]

  - variable: LEADS_PROVIDER_DEFAULT
    value: apollo
    availability: [RUNTIME]

  - variable: ENRICHMENT_PROVIDER_DEFAULT
    value: apollo
    availability: [RUNTIME]
  # Leads Finder como alternativa de prueba, solo la cuenta del dueño.
  # Bóveda de contactos y secretos server-only verificados; tope monetario por corrida.
  - variable: LEADS_FINDER_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: LEADS_FINDER_ALLOWED_EMAILS
    value: nicolas.yarur.g@yago.cl
    availability: [RUNTIME]
  - variable: LEADS_FINDER_MAX_RUN_USD
    value: "0.50"
    availability: [RUNTIME]
  # The app's own emails (weekly report, alerts, contact of the day, Apify balance) go out from this Yago address through
  # Resend (yago.cl verified, sa-east-1). Secret created 21 Oct; docs/informe-semanal.md, «Resend».
  - variable: REPORTS_FROM_EMAIL
    value: "ANTON.IA <avisos@yago.cl>"
    availability: [RUNTIME]
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability: [RUNTIME]
  # Activation authorized 12 Oct. Production SQL versions 20261012142946 and
  # 20261012143054 verified; fixed caps USD1.50/run, USD20/month/workspace.
  # Worker microworldsSearchTick is published before this rollout receives traffic.
  - variable: MICROWORLDS_HYBRID_ENABLED
    value: "true"
    availability: [RUNTIME]
  # Tope mensual por workspace en US$ (plan Apify de US$ 5 compartido con Oportunidades) y precio por contacto del plan.
  - variable: MICROWORLDS_MONTH_USD
    value: "4"
    availability: [RUNTIME]
  - variable: MICROWORLDS_LEAD_USD
    value: "0.003"
    availability: [RUNTIME]
  # Pipeline: cinco columnas, dos triggers y lectura privada de eventos verificados.
  - variable: CRM_DEAL_VALUES_ENABLED
    value: "true"
    availability: [RUNTIME]

  - variable: LEADS_DISABLE_EXTERNAL_FALLBACK
    value: "true"
    availability: [RUNTIME]

