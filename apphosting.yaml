  # Oportunidades: miembros actuales de GrupoExpro, verificados contra la organización en producción el 4 oct 2026.
  # El servidor exige correo confirmado y mantiene el alcance de la organización activa.
  # Las fuentes usan secretos RUNTIME de Secret Manager, con permiso del backend studio.
