# apphosting.yaml

runConfig:
  minInstances: 0
  maxInstances: 20
  concurrency: 100
  cpu: 1
  memoryMiB: 768

env:
  # === Primary production providers ===
  - variable: APOLLO_API_KEY
    secret: APOLLO_API_KEY
    availability: [RUNTIME]

  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability: [RUNTIME]

  - variable: OPENAI_MODEL
    value: gpt-5.6-luna
    availability: [RUNTIME]

  - variable: OPENAI_EMAIL_MODEL
    value: gpt-5.6-luna
    availability: [RUNTIME]

  - variable: OPENAI_FAST_MODEL
    value: gpt-5.6-luna
    availability: [RUNTIME]

  - variable: OPENAI_BALANCED_MODEL
    value: gpt-5.6-luna
    availability: [RUNTIME]

  - variable: OPENAI_ORCHESTRATOR_MODEL
    value: gpt-5.6-terra
    availability: [RUNTIME]

  - variable: OPENAI_REASONING_MODEL
    value: gpt-5.6-terra
    availability: [RUNTIME]

  - variable: NATIVE_RESEARCH_REPORT_MODEL
    value: gpt-5.6-terra
    availability: [RUNTIME]

  - variable: OPENAI_CRITICAL_MODEL
    value: gpt-5.6-sol
    availability: [RUNTIME]

  - variable: OPENAI_FALLBACK_MODEL
    value: gpt-5.6-luna
    availability: [RUNTIME]

  - variable: AI_PROVIDER
    value: openai
    availability: [RUNTIME]

  - variable: SUPLIA_CONTEXT_COMPACT_THRESHOLD_TOKENS
    value: "150000"
    availability: [RUNTIME]

  - variable: SUPLIA_CONTEXT_RECENT_MESSAGES
    value: "12"
    availability: [RUNTIME]

  - variable: NEXT_PUBLIC_SUPLIA_ENABLED
    value: "false"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_OPPORTUNITIES_ENABLED
    value: "false"
    availability: [BUILD, RUNTIME]

  # === Lead providers (Apollo/PDL trial) ===
