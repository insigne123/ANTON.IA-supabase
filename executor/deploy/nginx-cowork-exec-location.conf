# Cowork code executor: localhost service exposed under the existing TLS host.
location ^~ /cowork-exec/ {
    # Strip prefix: /cowork-exec/v1/jobs -> /v1/jobs
    rewrite ^/cowork-exec(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8899;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authorization passes through; the executor validates the bearer itself.
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 25m;
    limit_req zone=cowork_exec burst=5 nodelay;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
}
